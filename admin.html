<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mall Admin — Store Applications</title><style>body{font:15px system-ui;background:#f4f6fa;color:#14253a;margin:0}header{background:#11263e;color:white;padding:20px}main{max-width:950px;margin:25px auto;padding:0 15px}article{background:white;padding:20px;border-radius:14px;margin:12px 0;box-shadow:0 2px 10px #0001}button{border:0;background:#e8bd72;border-radius:8px;padding:10px 16px;margin:6px;cursor:pointer}button:disabled{opacity:.5}small{color:#64748b}#status{padding:14px;white-space:pre-wrap}</style></head><body><header><strong>🏬 World Virtual Mall — Admin applications</strong> <a href="index.html" style="color:white">Home</a></header><main><p>Only authorized administrators can review applications. Approvals assign the requested store and cannot be performed by sellers.</p><button id="refresh">Refresh applications</button><div id="status" role="status"></div><div id="list"></div></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>
const status=document.getElementById('status'),list=document.getElementById('list');
const client=window.supabase&&window.MALL_SUPABASE_PUBLISHABLE_KEY&&!window.MALL_SUPABASE_PUBLISHABLE_KEY.startsWith('REPLACE_')?window.supabase.createClient(window.MALL_SUPABASE_URL,window.MALL_SUPABASE_PUBLISHABLE_KEY):null;
function elt(tag,value){const node=document.createElement(tag);node.textContent=value;return node}
async function load(){list.replaceChildren();if(!client){status.textContent='Supabase is not configured.';return}status.textContent='Loading...';const {data:{user},error:authError}=await client.auth.getUser();if(authError||!user){status.textContent='Sign in through the seller login page first.';return}
const {data:admin,error:adminError}=await client.rpc('mall_is_admin');if(adminError||!admin){status.textContent='Access denied: this account is not an approved mall administrator.';return}
const {data,error}=await client.from('mall_store_applications').select('id,brand_name,market_id,unit_number,description,status,created_at').eq('status','pending').order('created_at',{ascending:true}).limit(100);
if(error){status.textContent='Unable to load: '+error.message;return}
status.textContent=data.length+' pending application(s)';
for(const item of data){const card=document.createElement('article');card.append(elt('h3',item.brand_name),elt('p',item.market_id+' · Store '+String(item.unit_number).padStart(3,'0')),elt('p',item.description),elt('small',new Date(item.created_at).toLocaleString()));
for(const [label,approve] of [['Approve',true],['Reject',false]]){const b=elt('button',label);b.onclick=async()=>{if(!confirm(label+' this application?'))return;b.disabled=true;const {data,error}=await client.rpc('mall_review_application',{p_id:item.id,p_approve:approve});status.textContent=error?'Action failed: '+error.message:'Application '+data;await load()};card.append(b)}list.append(card)}
}
document.getElementById('refresh').onclick=load;load();
</script><script src="language.js"></script></body></html>
