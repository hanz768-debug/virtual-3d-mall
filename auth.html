<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود فروشندگان | World Virtual Mall</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#182b40;font:15px Tahoma,Arial}header{background:#10243a;color:white;padding:18px;display:flex;justify-content:space-between;gap:10px}a{color:inherit}main{max-width:530px;margin:32px auto;padding:0 16px}section{background:#fff;border-radius:18px;padding:24px;box-shadow:0 5px 24px #162d4114}label{display:block;margin:15px 0 7px;font-weight:bold}input{width:100%;border:1px solid #c8d3df;border-radius:9px;padding:13px;font:inherit}button{background:#e7bb6b;color:#16263a;border:0;border-radius:9px;padding:12px 15px;margin:12px 4px 0;cursor:pointer;font-weight:bold}button:disabled{opacity:.55}#message{margin-top:15px;line-height:1.8;white-space:pre-wrap}.muted{color:#66788a;line-height:1.9;font-size:13px}.warning{background:#fff2d5;border-radius:9px;padding:12px}.ok{background:#e3f6e9;border-radius:9px;padding:12px}#account{display:none}</style><link rel="stylesheet" href="pesivia-shared-background.css?v=56aa0e1b"><style id="pesivia-inner-glass-unified">

border:1px solid rgba(255,255,255,.7)!important;

}

}

</style><style id="pesivia-navigation-back-style">
#pesivia-page-back{position:relative;z-index:10;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:42px;padding:9px 15px;margin:6px 8px 6px 0;border:1px solid rgba(255,255,255,.8)!important;border-radius:14px!important;background:rgba(7,20,42,.38)!important;color:#fff!important;font:700 15px system-ui,sans-serif!important;text-shadow:0 1px 3px #000!important;cursor:pointer;white-space:nowrap;backdrop-filter:blur(2px)}
</style></head><body><header><strong>🏬 ورود فروشندگان</strong><a href="index.html">بازارهای جهانی ↩</a></header><main><section><h2>حساب فروشنده</h2><p class="muted">ثبت‌نام با ایمیل و رمز عبور. برای دریافت مغازه، تأیید مدیریت جداگانه لازم است.</p><div id="forms"><label for="email">ایمیل</label><input id="email" type="email" autocomplete="email"><label for="password">رمز عبور</label><input id="password" type="password" autocomplete="current-password" minlength="8"><button id="signup">ایجاد حساب</button><button id="login">ورود</button><button id="reset">بازیابی رمز</button></div><div id="account"><p id="who"></p><a href="seller.html">رفتن به پنل درخواست مغازه</a><p><button id="logout">خروج از حساب</button></p></div><div id="message" role="status" aria-live="polite"></div><p class="muted">هر حساب فقط به داده‌های مجاز خودش دسترسی خواهد داشت. پرداخت و اجاره واقعی هنوز فعال نیست.</p></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>
const $=id=>document.getElementById(id);const key=window.MALL_SUPABASE_PUBLISHABLE_KEY,url=window.MALL_SUPABASE_URL;const ready=!!(window.supabase&&url&&key&&!key.startsWith('REPLACE_'));let client=null;
function msg(text,ok=false){$('message').className=ok?'ok':'warning';$('message').textContent=text}
function show(user){$('forms').style.display=user?'none':'block';$('account').style.display=user?'block':'none';$('who').textContent=user?'وارد شده با: '+user.email:''}
if(!ready){msg('اتصال ورود هنوز فعال نشده است. برای راه‌اندازی، کلید Publishable پروژه World Virtual Mall باید در تنظیمات سایت قرار گیرد. رمز پایگاه داده یا کلید Secret لازم نیست.');document.querySelectorAll('button').forEach(b=>b.disabled=true)}
else{client=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});client.auth.getUser().then(({data,error})=>{if(error)msg(error.message);show(data?.user)});client.auth.onAuthStateChange((event,session)=>show(session?.user))}
async function act(type){if(!client)return;const email=$('email').value.trim(),password=$('password').value;if(!email){msg('ایمیل را وارد کنید');return}if(type!=='reset'&&password.length<8){msg('رمز عبور باید حداقل ۸ کاراکتر باشد');return}document.querySelectorAll('button').forEach(b=>b.disabled=true);try{let result;if(type==='signup')result=await client.auth.signUp({email,password,emailRedirectTo:location.origin+location.pathname});else if(type==='login')result=await client.auth.signInWithPassword({email,password});else result=await client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(result.error)msg(result.error.message);else if(type==='signup')msg('درخواست ثبت‌نام ارسال شد. اگر تأیید ایمیل فعال باشد، ایمیل خود را بررسی کنید.',true);else if(type==='reset')msg('اگر این ایمیل ثبت شده باشد، راهنمای بازیابی ارسال می‌شود.',true);else msg('ورود موفق بود.',true)}catch(e){msg('خطای ارتباط: '+e.message)}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
$('signup').onclick=()=>act('signup');$('login').onclick=()=>act('login');$('reset').onclick=()=>act('reset');$('logout').onclick=async()=>{if(!client)return;const {error}=await client.auth.signOut();if(error)msg(error.message);else msg('از حساب خارج شدید.',true)};
</script><script src="language.js"></script><script id="pesivia-navigation-back">
(function(){if(document.getElementById('pesivia-page-back'))return;const b=document.createElement('button');b.type='button';b.id='pesivia-page-back';b.textContent='← Back';b.setAttribute('aria-label','Back to previous PESIVIA page');b.addEventListener('click',function(){let ref=null;try{ref=new URL(document.referrer);if(ref.origin!==location.origin||ref.pathname===location.pathname)ref=null}catch(e){}if(ref){location.href=ref.href}else{location.href='pesivia-services-hub.html'}});const header=document.querySelector('header');if(header)header.prepend(b);else document.body.prepend(b)})();
</script></body></html>
