<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PESIVIA | Orders</title><link rel="stylesheet" href="pesivia-shared-background.css?v=56aa0e1b"><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;color:#fff;font:16px system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;background:rgba(8,19,37,.2);border-bottom:1px solid #ffffff88}header button,header select,a.action{padding:10px 14px;min-height:44px;border:1px solid #ffffffbc;border-radius:13px;background:rgba(8,25,47,.38);color:#fff;font:700 15px system-ui;text-decoration:none}main{max-width:650px;margin:24px auto;padding:14px}.panel{padding:22px;border:1px solid #ffffffb0;border-radius:18px;background:rgba(8,23,43,.22)}h1,p{color:#fff;text-shadow:0 2px 5px #000}h1{font-size:26px}p{line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}</style><style id="pesivia-home-link-style">html body>header .pesivia-home-link{display:inline-flex!important;align-items:center!important;justify-content:center!important;flex:0 0 auto!important;min-height:42px!important;padding:9px 12px!important;margin:0!important;border:1px solid rgba(255,255,255,.78)!important;border-radius:13px!important;background:rgba(8,23,44,.42)!important;color:#fff!important;text-decoration:none!important;font:700 14px system-ui,sans-serif!important;text-shadow:0 1px 3px #000!important;white-space:nowrap!important;box-sizing:border-box!important}html body>header{flex-wrap:wrap!important;gap:8px!important}html body>header .pesivia-home-link:focus-visible{outline:2px solid white!important}</style><link rel="stylesheet" href="pesivia-inner-readable.css?v=792827b7"></head><body><header><a class="pesivia-home-link" href="pesivia-services-hub.html" aria-label="Home">⌂ Home</a><button id="back" type="button">← Back</button><select id="language" aria-label="Language"><option value="en">English</option><option value="fa">فارسی</option><option value="es">Español</option></select></header><main><section class="panel"><h1 id="title">📦 Orders</h1><p id="status">Online ordering and checkout are not yet active. No orders have been placed through this marketplace.</p><p id="detail">Products can be explored and saved to your cart, but this does not create an order.</p><div class="actions"><a class="action" id="cart" href="pesivia-cart.html">My Cart</a><a class="action" id="stores" href="pesivia-store-directory.html">All Stores</a></div></section></main><script>
const labels={en:{back:'← Back',title:'📦 Orders',status:'Online ordering and checkout are not yet active. No orders have been placed through this marketplace.',detail:'Products can be explored and saved to your cart, but this does not create an order.',cart:'My Cart',stores:'All Stores'},fa:{back:'← بازگشت',title:'📦 سفارش‌ها',status:'ثبت سفارش و پرداخت آنلاین هنوز فعال نیست. هیچ سفارشی از طریق این بازار ثبت نشده است.',detail:'می‌توانید محصولات را ببینید و در سبد خرید ذخیره کنید، اما این کار سفارش ایجاد نمی‌کند.',cart:'سبد خرید',stores:'همه فروشگاه‌ها'},es:{back:'← Volver',title:'📦 Pedidos',status:'Los pedidos y pagos en línea aún no están disponibles. No se han realizado pedidos en este mercado.',detail:'Puedes guardar productos en el carrito, pero esto no crea un pedido.',cart:'Mi carrito',stores:'Todas las tiendas'}};
let lang='en';try{const x=new URLSearchParams(location.search).get('lang')||localStorage.getItem('pesivia-market-language');if(labels[x])lang=x}catch(e){}function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';document.getElementById('language').value=lang;for(const id of ['back','title','status','detail','cart','stores'])document.getElementById(id).textContent=labels[lang][id];document.getElementById('cart').href='pesivia-cart.html?lang='+lang;document.getElementById('stores').href='pesivia-store-directory.html?lang='+lang;try{localStorage.setItem('pesivia-market-language',lang)}catch(e){}}document.getElementById('language').onchange=e=>{lang=e.target.value;render()};document.getElementById('back').onclick=()=>{location.href='pesivia-services-hub.html?lang='+lang};render();
