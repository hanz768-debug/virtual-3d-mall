<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PESIVIA | My Cart</title><style>*{box-sizing:border-box}body{margin:0;background:#0c142b;color:#f8f5ff;font:15px system-ui,-apple-system,sans-serif}header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;background:#111d39;border-bottom:1px solid #9270b7}button,select{background:#26385b;color:white;border:1px solid #a68bcb;border-radius:10px;padding:10px;font:inherit;cursor:pointer}main{max-width:780px;margin:auto;padding:18px 13px}h1{font-size:25px}p{color:#c6c5d9;line-height:1.6}.item{background:#182746;border:1px solid #7c639e;border-radius:14px;margin:12px 0;padding:15px}.item h2{font-size:18px;margin:0 0 8px}.price{color:#f4d39d;font-weight:700}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.controls button{min-width:44px}.total{font-size:21px;font-weight:700;padding:15px 0;border-top:1px solid #6e5d83}.notice{padding:15px;background:#1c2c4b;border:1px solid #9473b8;border-radius:12px}.link{color:#ebd0ff}footer{padding:20px;text-align:center;color:#a6a3be}</style><link rel="stylesheet" href="pesivia-shared-background.css?v=56aa0e1b"></head><body><header><button id="back">← Back</button><select id="language" aria-label="Language"><option value="en">English</option><option value="fa">فارسی</option><option value="es">Español</option></select></header><main><h1 id="title">🛒 My Cart</h1><p id="intro">Your selected products are saved on this device only.</p><div id="items"></div><div class="total" id="total"></div><div class="notice" id="notice">Checkout and payments are not enabled. No order will be placed.</div><p><a class="link" href="pesivia-store-directory.html" id="browse">Browse Stores</a></p></main><footer>PESIVIA Virtual Mall</footer><script>
const KEY='pesivia-market-cart-v1';const texts={en:{back:'← Back',title:'🛒 My Cart',intro:'Your selected products are saved on this device only.',empty:'Your cart is empty.',remove:'Remove',total:'Estimated total',notice:'Checkout and payments are not enabled. No order will be placed.',browse:'Browse Stores',mixed:'Totals by currency',qty:'Quantity'},fa:{back:'← بازگشت',title:'🛒 سبد خرید',intro:'محصولات انتخاب‌شده فقط روی این دستگاه ذخیره می‌شوند.',empty:'سبد خرید خالی است.',remove:'حذف',total:'جمع تخمینی',notice:'پرداخت و ثبت سفارش هنوز فعال نیست و سفارشی ثبت نخواهد شد.',browse:'مشاهده فروشگاه‌ها',mixed:'جمع بر اساس ارز',qty:'تعداد'},es:{back:'← Volver',title:'🛒 Mi carrito',intro:'Los productos seleccionados se guardan solo en este dispositivo.',empty:'El carrito está vacío.',remove:'Eliminar',total:'Total estimado',notice:'El pago no está habilitado. No se realizará ningún pedido.',browse:'Ver tiendas',mixed:'Totales por moneda',qty:'Cantidad'}};
let lang='en';try{const x=new URLSearchParams(location.search).get('lang')||localStorage.getItem('pesivia-market-language');if(texts[x])lang=x}catch(e){}const t=k=>texts[lang][k]||texts.en[k];function getCart(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a.filter(x=>x&&typeof x.id==='string'&&Number.isSafeInteger(x.price_cents)&&x.price_cents>=0&&Number.isInteger(x.qty)&&x.qty>0).slice(0,100):[]}catch(e){return []}}function putCart(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function setLang(l){lang=texts[l]?l:'en';document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';document.getElementById('language').value=lang;for(const id of ['back','title','intro','notice','browse'])document.getElementById(id).textContent=t(id);document.getElementById('browse').href='pesivia-store-directory.html?lang='+lang;try{localStorage.setItem('pesivia-market-language',lang)}catch(e){}render()}document.getElementById('language').onchange=e=>setLang(e.target.value);document.getElementById('back').onclick=()=>{location.href='pesivia-services-hub.html?lang='+encodeURIComponent(lang)};
function render(){const root=document.getElementById('items'),total=document.getElementById('total');root.replaceChildren();const a=getCart();if(!a.length){const p=document.createElement('p');p.textContent=t('empty');root.append(p);total.textContent='';return}const totals={};for(const item of a){const row=document.createElement('article');row.className='item';const title=document.createElement('h2');title.textContent=item.title;const price=document.createElement('p');price.className='price';price.textContent=(item.price_cents/100).toFixed(2)+' '+item.currency;const controls=document.createElement('div');controls.className='controls';const minus=document.createElement('button');minus.textContent='−';minus.setAttribute('aria-label','Decrease quantity');const qty=document.createElement('span');qty.textContent=t('qty')+': '+item.qty;const plus=document.createElement('button');plus.textContent='+';plus.setAttribute('aria-label','Increase quantity');const remove=document.createElement('button');remove.textContent=t('remove');minus.onclick=()=>change(item.id,-1);plus.onclick=()=>change(item.id,1);remove.onclick=()=>{putCart(getCart().filter(x=>x.id!==item.id));render()};controls.append(minus,qty,plus,remove);row.append(title,price,controls);root.append(row);totals[item.currency]=(totals[item.currency]||0)+item.price_cents*item.qty}total.textContent=t('total')+': '+Object.entries(totals).map(([c,v])=>(v/100).toFixed(2)+' '+c).join(' · ')}
function change(id,delta){const a=getCart(),x=a.find(v=>v.id===id);if(!x)return;x.qty=Math.max(0,Math.min(99,x.qty+delta));putCart(a.filter(v=>v.qty>0));render()}setLang(lang);
</script></body></html>
