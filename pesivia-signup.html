<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PESIVIA | Create Account</title><link rel="stylesheet" href="pesivia-shared-background.css?v=56aa0e1b"><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;color:white;font:16px system-ui,sans-serif}header{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #ffffff8a}header a,header select,button{border:1px solid #ffffffb0;background:rgba(9,25,46,.5);border-radius:12px;color:#fff;padding:11px 15px;font:700 15px system-ui;text-decoration:none}main{max-width:540px;margin:18px auto;padding:12px}.panel{padding:22px 18px;border:1px solid #ffffffa8;border-radius:18px;background:rgba(6,19,37,.2)}h1{font-size:26px;margin:0 0 10px}h1,p,label{color:#fff;text-shadow:0 2px 5px #000}label{display:block;margin:14px 0 6px;font-weight:700}input{width:100%;padding:12px;min-height:46px;border-radius:12px;background:rgba(9,25,46,.7);border:1px solid #ffffffb0;color:white;font:16px system-ui}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{cursor:pointer}button:disabled{opacity:.55}#status{min-height:20px;overflow-wrap:anywhere;line-height:1.5}</style></head><body><header><a href="auth.html" id="back">← Login</a><select id="lang" aria-label="Language"><option value="en">English</option><option value="fa">فارسی</option><option value="es">Español</option></select></header><main><div class="panel"><h1 id="title">Create Account</h1><p id="intro">Register your PESIVIA marketplace account.</p><form id="form" novalidate><label id="emailLabel" for="email">Email</label><input id="email" type="email" autocomplete="email" required><label id="passLabel" for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label id="confirmLabel" for="confirm">Confirm Password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" r (()=>{'use strict';const $=id=>document.getElementById(id);const dict={en:['Create Account','Register your PESIVIA marketplace account.','Email','Password','Confirm Password','Create Account','Back to Login','← Login','Enter a valid email.','Password must be at least 8 characters.','Passwords do not match.','Check your email to confirm your account.','Registration service is unavailable.'],fa:['ایجاد حساب','حساب بازار PESIVIA خود را ایجاد کنید.','ایمیل','رمز عبور','تأیید رمز عبور','ایجاد حساب','بازگشت به ورود','← ورود','ایمیل معتبر وارد کنید.','رمز عبور باید حداقل ۸ کاراکتر باشد.','رمزهای عبور یکسان نیستند.','ایمیل خود را برای تأیید حساب بررسی کنید.','خدمات ثبت‌نام در دسترس نیست.'],es:['Crear cuenta','Crea tu cuenta de PESIVIA.','Correo','Contraseña','Confirmar contraseña','Crear cuenta','Volver a iniciar sesión','← Inicio','Introduce un correo válido.','La contraseña debe tener 8 caracteres.','Las contraseñas no coinciden.','Revisa tu correo para confirmar tu cuenta.','Registro no disponible.']};let lang='en';try{let x=localStorage.getItem('pesivia-market-language');if(dict[x])lang=x}catch(e){}function render(){const t=dict[lang];['title','intro','emailLabel','passLabel','confirmLabel','submit','cancel','back'].forEach((id,i)=>$(id).textContent=t[i]);$('lang').value=lang;document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr'}$('lang').onchange=()=>{lang=$('lang').value;localStorage.setItem('pesivia-market-language',lang);render()};render();$('form').onsubmit=async e=>{e.preventDefault();const t=dict[lang],email=$('email').value.trim(),password=$('password').value;if(!email||!$('email').checkValidity()){ $('status').textContent=t[8];$('email').focus();return}if(password.length<8){$('status').textContent=t[9];return}if(password!==$('confirm').value){$('status').textContent=t[10];return}if(!window.supabase||!window.MALL_SUPABASE_URL||!window.MALL_SUPABASE_PUBLISHABLE_KEY){$('status').textContent=t[12];return}const btn=$('submit');btn.disabled=true;try{const api=window.supabase.createClient(window.MALL_SUPABASE_URL,window.MALL_SUPABASE_PUBLISHABLE_KEY);const {data,error}=await api.auth.signUp({email,password,options:{emailRedirectTo:new URL('auth.html',location.href).href}});if(error)throw error;if(data?.session)location.replace('my-store.html');else $('status').textContent=t[11]}catch(err){$('status').textContent=err.message||t[12]}finally{btn.disabled=false}}})();
