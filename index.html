function animate(t){requestAnimationFrame(animate);if(inStore){storeWalk+=(storeTarget-storeWalk)*.1;storeYaw+=(storeYawTarget-storeYaw)*.13;camera.position.set(100,1.65,-storeWalk);camera.lookAt(100+Math.sin(storeYaw)*10,1.65,camera.position.z-Math.cos(storeYaw)*10);document.getElementById('position').textContent='داخل مغازه'}else{progress+=(target-progress)*.09;lateral+=(lateralTarget-lateral)*.1;yaw+=(yawTarget-yaw)*.12;camera.position.z=4-progress;camera.position.x=lateral;camera.position.y=1.68+Math.sin(t*.003)*.018;camera.lookAt(lateral+Math.sin(yaw)*12,1.62,camera.position.z-Math.cos(yaw)*12);document.getElementById('position').textContent='پیشروی '+Math.round(progress/max*100)+'٪'}renderer.render(scene,camera)}animate(0);document.getElementById('loading').style.display='none';addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script><script>setTimeout(()=>{if(document.getElementById('loading').style.display!=='none'){document.getElementById('loading').style.display='none';document.getElementById('fallback').style.display='block'}},16000)</script></body></html>
