<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>بازار مجازی سه‌بعدی</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#071425;color:#fff;font-family:Tahoma,Arial}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#0b1930;gap:8px;font-size:13px}button{background:#efb653;border:0;border-radius:11px;padding:11px;color:#13223a;font-weight:700;cursor:pointer}#viewport{height:calc(100dvh - 130px);position:relative;overflow:hidden;touch-action:none;perspective:700px;background:linear-gradient(#10213b,#42627a 54%,#152b46 55%,#0c182b)}#sky{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 43%,#7592a288,transparent 55%)}#world{position:absolute;inset:0;overflow:hidden;pointer-events:none}.piece{position:absolute;transform-origin:center center;will-change:transform,opacity;pointer-events:auto}.store{background:linear-gradient(120deg,#0d2945,#395e77 45%,#152b46);border:3px solid #d8b779;box-shadow:inset 0 0 24px #000b,0 8px 18px #0009;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:8px;text-align:center;cursor:pointer}.store .symbol{font-size:clamp(22px,5vw,36px)}.store b{font-size:clamp(12px,3vw,19px)}.store small{background:#081b33;padding:5px 7px;border-radius:6px;font-size:11px}.ad{background:#081d36;border:3px solid #d8b779;border-radius:8px;text-align:center;padding:12px;font-weight:bold;box-shadow:0 0 22px #f0b94d55}.tile{background:#8999aa22;border:1px solid #d6e5f455;transform-origin:top center}.line{background:#c3d4e055}.hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px;text-shadow:0 1px 5px #000;pointer-events:none}footer{height:66px;background:#0b1930;display:flex;align-items:center;justify-content:space-around;gap:8px}#overlay{display:none;position:fixed;inset:0;z-index:20;background:#0b1930;overflow:auto;-webkit-overflow-scrolling:touch;padding:15px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}.product{background:#243e60;border:1px solid #7691ad;border-radius:12px;padding:16px;text-align:center;cursor:pointer}.product span{font-size:50px;display:block;margin:10px}.detail{max-width:500px;background:#233d5b;padding:22px;margin:20px auto;border-radius:15px;line-height:2}#progress{font-variant-numeric:tabular-nums;font-size:12px}</style></head><body><header><b>🏬 بازار جهانی 3D</b><span id="cart">🛒 ۰</span><button onclick="window.open(location.href,'_blank')">🌐 Open Browser</button></header><div id="viewport"><div id="sky"></div><div id="world"></div><div class="hint">انگشت را بالا بکشید تا در راهرو قدم بزنید</div></div><footer><button id="back">⬇ عقب</button><span id="progress">ابتدای بازار</span><button id="forward">⬆ جلو</button></footer><section id="overlay"></section><script>
const names=['پوشاک','موبایل','جواهرات','خانه','کفش','اسباب‌بازی','ورزش','آرایشی','کتاب','ابزار','خودرو','سلامت','مبلمان','گل','حیوانات','ساعت','سفر','خوراکی','موسیقی','هدایا'];const icons=['👗','📱','💎','🏠','👟','🧸','⚽','💄','📚','🛠️','🚗','🧴','🛋️','🪴','🐾','⌚','🧳','🍫','🎸','🎁'];const vp=document.getElementById('viewport'),world=document.getElementById('world'),overlay=document.getElementById('overlay');let camera=0,target=0,selected=0,cart=0,drag=false,lastY=0,velocity=0,mode='hall';const max=19*320;let elements=[];function el(cls,content,click){let d=document.createElement('div');d.className='piece '+cls;d.innerHTML=content;world.appendChild(d);if(click)d.addEventListener('click',click);return d}for(let i=0;i<20;i++){let side=i%2?'right':'left',d=el('store','<span class="symbol">'+icons[i]+'</span><b>'+names[i]+'</b><small>🚪 ورود به مغازه</small>',()=>enter(i));elements.push({node:d,type:'store',z:340+i*320,side});if(i%2===0){let a=el('ad','✨ '+['تبلیغات ویژه','فروش فوق‌العاده','جدیدترین محصولات','فضای تبلیغاتی'][i%4]+' ✨');elements.push({node:a,type:'ad',z:490+i*320})}}for(let i=0;i<75;i++){let d=el('tile','');elements.push({node:d,type:'tile',z:i*95+50})}function paint(){let w=vp.clientWidth,h=vp.clientHeight,cx=w/2,hy=h*.52;for(let p of elements){let z=p.z-camera;if(z<35||z>2500){p.node.style.display='none';continue}p.node.style.display='flex';let s=620/(z+450),scale=Math.min(2.8,s*2.5),near=1/(1+z/900);if(p.type==='store'){let sw=Math.min(w*.43,280)*scale,sh=165*scale,x=cx+(p.side==='left'?-1:1)*(w*.16+170*near)-sw/2,y=hy+95*near-sh*.48;p.node.style.cssText+='';Object.assign(p.node.style,{width:sw+'px',height:sh+'px',left:x+'px',top:y+'px',opacity:Math.min(1,(2500-z)/400),zIndex:Math.round(3000-z),transform:'skewY('+(p.side==='left'?7:-7)+'deg)'})}else if(p.type==='ad'){let aw=Math.min(w*.55,400)*scale*.85;p.node.style.width=aw+'px';p.node.style.left=(cx-aw/2)+'px';p.node.style.top=(hy-230*scale)+'px';p.node.style.fontSize=Math.max(9,15*scale)+'px';p.node.style.opacity=Math.min(1,(2500-z)/400);p.node.style.zIndex=Math.round(3000-z)}else{let y=hy+380/(z/280+1),width=w*(.16+1.1/(z/300+1));p.node.style.left=(cx-width/2)+'px';p.node.style.top=y+'px';p.node.style.width=width+'px';p.node.style.height=Math.max(2,60/(z/350+1))+'px';p.node.style.opacity=.7;p.node.style.zIndex=0}}document.getElementById('progress').textContent='پیشروی '+Math.round(camera/max*100)+'٪';if(Math.abs(target-camera)>.03){camera+=(target-camera)*.13}else camera=target;requestAnimationFrame(paint)}requestAnimationFrame(paint);function move(n){target=Math.max(0,Math.min(max,target+n))}vp.addEventListener('pointerdown',e=>{drag=true;lastY=e.clientY;velocity=0;vp.setPointerCapture(e.pointerId)});vp.addEventListener('pointermove',e=>{if(!drag)return;let delta=lastY-e.clientY;lastY=e.clientY;if(Math.abs(delta)>0){velocity=delta;move(delta*3.5)}});vp.addEventListener('pointerup',()=>{drag=false});vp.addEventListener('pointercancel',()=>{drag=false});vp.addEventListener('wheel',e=>{e.preventDefault();move(e.deltaY*.7)},{passive:false});document.getElementById('forward').onclick=()=>move(240);document.getElementById('back').onclick=()=>move(-240);function enter(i){selected=i;overlay.style.display='block';overlay.innerHTML='<div class="top"><h2>'+icons[i]+' '+names[i]+'</h2><button onclick="closeShop()">↩ بازگشت</button></div><p>فروشگاه آزمایشی — محصولات دو طرف راهرو</p><div class="products">'+Array.from({length:8},(_,n)=>'<div class="product" onclick="detail('+n+')"><span>'+icons[i]+'</span>محصول '+(n+1)+'<p>$'+(29+n*15)+'.00</p><button>مشاهده</button></div>').join('')+'</div>'}function detail(n){overlay.scrollTop=0;overlay.innerHTML='<div class="top"><h2>اطلاعات محصول</h2><button onclick="enter(selected)">↩ بازگشت</button></div><div class="detail"><div style="font-size:90px;text-align:center">'+icons[selected]+'</div><h2>'+names[selected]+' — محصول '+(n+1)+'</h2><h2>$'+(29+n*15)+'.00</h2><p>فروشنده: فروشگاه نمونه</p><p>🚚 ارسال استاندارد یا سریع</p><p>📦 موجودی آزمایشی</p><p>↩ مرجوعی طبق شرایط فروشنده</p><button onclick="addCart()">🛒 افزودن به سبد</button><p>پرداخت واقعی فعال نیست.</p></div>'}function addCart(){cart++;document.getElementById('cart').textContent='🛒 '+cart;alert('به سبد آزمایشی اضافه شد')}function closeShop(){overlay.style.display='none'}</script></body></html>
