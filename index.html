<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بازار سه‌بعدی</title><style>*{box-sizing:border-box}body{margin:0;background:#101b30;color:white;font:16px Tahoma,Arial}header,footer{padding:14px;background:#0a1428;display:flex;justify-content:space-between;align-items:center;gap:8px}button{border:0;border-radius:12px;background:#f4b747;color:#142139;padding:13px;font-weight:bold;cursor:pointer}#hall{height:calc(100dvh - 145px);position:relative;overflow:hidden;background:linear-gradient(#152b4a,#435e78 52%,#263851 53%,#111c31);touch-action:pan-y}.floor{position:absolute;inset:53% -60% -35%;transform:rotateX(65deg);transform-origin:top;background:repeating-linear-gradient(90deg,transparent 0 19%,#ffffff40 19.2% 19.5%),repeating-linear-gradient(0deg,transparent 0 17%,#ffffff40 17.2% 17.5%)}#ad{position:absolute;top:8%;left:22%;width:56%;border:3px solid #dcb86b;background:#0a1d36;text-align:center;padding:16px;border-radius:10px}.shop{position:absolute;width:42%;height:24%;background:linear-gradient(120deg,#1a3459,#52748b);border:4px solid #d1ae75;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:inset 0 0 25px #0009;cursor:pointer;text-align:center}.shop.left{left:-4%;transform:skewY(8deg)}.shop.right{right:-4%;transform:skewY(-8deg)}.shop.far{top:31%;scale:.7}.shop.near{top:62%;scale:1.1}.shop b{font-size:20px}.shop small{background:#0b1b34;padding:6px;border-radius:6px}#hint{position:absolute;bottom:5px;text-align:center;width:100%;font-size:12px}#overlay{display:none;position:fixed;inset:0;background:#0c1b31;overflow:auto;padding:18px;z-index:10}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.shelves{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{background:#243e60;border:1px solid #6683a0;border-radius:12px;text-align:center;padding:22px 8px;cursor:pointer}.item span{display:block;font-size:50px;margin:10px}.detail{background:#233d5b;border-radius:14px;padding:20px;margin:20px auto;max-width:500px;line-height:2}footer{height:75px}header{height:70px;font-size:14px}</style><header><strong>🏬 بازار جهانی</strong><span id="cart">🛒 ۰</span><button onclick="window.open(location.href,'_blank')">🌐 Open Browser</button></header><main id="hall"><div class="floor"></div><div id="ad">✨ بنر تبلیغاتی ✨</div><div id="shops"></div><div id="hint">انگشت را به بالا بکشید تا جلو بروید</div></main><footer><button onclick="move(-1)">⬇ عقب</button><span id="position"></span><button onclick="move(1)">⬆ جلو</button></footer><section id="overlay"></section><script>const names=['پوشاک','موبایل','جواهرات','خانه','کفش','اسباب‌بازی','ورزش','آرایشی','کتاب','ابزار','خودرو','سلامت','مبلمان','گل','حیوانات','ساعت','سفر','خوراکی','موسیقی','هدایا'],icons=['👗','📱','💎','🏠','👟','🧸','⚽','💄','📚','🛠️','🚗','🧴','🛋️','🪴','🐾','⌚','🧳','🍫','🎸','🎁'];let step=0,selected=0,count=0;const overlay=document.getElementById('overlay'),hall=document.getElementById('hall');function render(){document.getElementById('shops').innerHTML=Array.from({length:4},(_,j)=>{let i=(step*2+j)%20;return '<div class="shop '+(j%2?'right':'left')+' '+(j<2?'far':'near')+'" onclick="enter('+i+')"><b>'+icons[i]+' '+names[i]+'</b><small>🚪 ورود به مغازه</small></div>'}).join('');document.getElementById('position').textContent='موقعیت '+(step+1)+' / ۲۰';document.getElementById('ad').textContent=['✨ تبلیغات ویژه ✨','🎉 فروش فوق‌العاده','📣 تبلیغات فروشندگان'][step%3]}function move(n){step=(step+n+20)%20;render()}let start=0;hall.addEventListener('touchstart',e=>start=e.touches[0].clientY,{passive:true});hall.addEventListener('touchend',e=>{let d=start-e.changedTouches[0].clientY;if(Math.abs(d)>35)move(d>0?1:-1)},{passive:true});hall.addEventListener('wheel',e=>move(e.deltaY>0?1:-1),{passive:true});function enter(i){selected=i;overlay.style.display='block';overlay.innerHTML='<div class="top"><h2>'+icons[i]+' '+names[i]+'</h2><button onclick="closeShop()">بازگشت ↩</button></div><p>قفسه محصولات در دو طرف مغازه</p><div class="shelves">'+Array.from({length:8},(_,n)=>'<div class="item" onclick="detail('+n+')"><span>'+icons[i]+'</span>محصول '+(n+1)+'<p>$'+(29+15*n)+'.00</p><button>مشاهده</button></div>').join('')+'</div>'}function detail(n){overlay.innerHTML='<div class="top"><h2>اطلاعات محصول</h2><button onclick="enter(selected)">بازگشت ↩</button></div><div class="detail"><div style="font-size:90px;text-align:center">'+icons[selected]+'</div><h2>'+names[selected]+' - محصول '+(n+1)+'</h2><h2>$'+(29+15*n)+'.00</h2><p>فروشنده: فروشگاه نمونه</p><p>🚚 ارسال استاندارد یا سریع</p><p>📦 موجودی آزمایشی</p><p>↩ مرجوعی مطابق شرایط فروشنده</p><button onclick="add()">🛒 افزودن به سبد</button><p>پرداخت واقعی فعال نیست.</p></div>'}function add(){count++;document.getElementById('cart').textContent='🛒 '+count;alert('به سبد آزمایشی اضافه شد')}function closeShop(){overlay.style.display='none'}render();</script></html>
