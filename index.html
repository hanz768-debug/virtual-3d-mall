<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>بازار سه‌بعدی جهانی</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#14243a;color:white;font-family:Tahoma,Arial}#view{position:fixed;inset:0;touch-action:none}canvas{display:block}header{position:fixed;z-index:4;top:env(safe-area-inset-top);left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:7px;padding:10px;background:#07182bce;backdrop-filter:blur(10px);font-size:13px}button{background:#f2bd62;border:0;border-radius:12px;padding:11px 13px;color:#162235;font-weight:bold;cursor:pointer}#controls{position:fixed;z-index:4;bottom:calc(12px + env(safe-area-inset-bottom));left:8px;right:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#07182bbb;padding:7px;border-radius:18px;flex-wrap:wrap;justify-content:center}#controls button{padding:10px 7px;font-size:12px}#controls span{font-size:11px;min-width:42px;text-align:center}#hint{position:fixed;bottom:calc(87px + env(safe-area-inset-bottom));left:10px;right:10px;text-align:center;text-shadow:0 2px 5px #000;font-size:12px;pointer-events:none}#overlay{position:fixed;z-index:8;inset:0;background:#f4f6fa;color:#14243a;overflow:auto;display:none;padding:18px;padding-top:calc(20px + env(safe-area-inset-top))}#overlay .top{display:flex;align-items:center;justify-content:space-between;gap:10px}#navback{position:fixed;z-index:30;bottom:calc(20px + env(safe-area-inset-bottom));left:16px;display:none;box-shadow:0 4px 20px #0005}#overlay{padding-bottom:100px}.shelf{display:grid;grid-template-columns:1fr 1fr;gap:12px}.product{border-radius:13px;background:white;box-shadow:0 2px 12px #10294420;padding:15px;text-align:center}.product .emoji{font-size:52px;display:block;margin:15px}.detail{background:white;border-radius:16px;padding:22px;line-height:2;max-width:520px;margin:20px auto}#loading{position:fixed;z-index:10;inset:0;background:#14243a;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}#fallback{display:none;position:fixed;inset:20% 10%;z-index:11;background:#122c47;padding:25px;border-radius:15px}</style></head><body><div id="view"></div><header><strong>🏬 بازار جهانی سه‌بعدی</strong><span id="cart">🛒 ۰</span><button onclick="window.open(location.href,'_blank')">🌐 Open Browser</button></header><div id="hint">👆 بالا/پایین: راه رفتن • چپ/راست: چرخش دید • روی ویترین بزنید</div><div id="controls"><button id="left">⬅ چپ</button><button id="back">⬇ عقب</button><span id="position">ورودی</span><button id="forward">⬆ جلو</button><button id="right">راست ➡</button></div><section id="overlay"></section><button id="navback" type="button">↩ بازگشت</button><div id="loading">در حال ساخت مرکز خرید سه‌بعدی... 🏬</div><div id="fallback">بارگذاری موتور سه‌بعدی انجام نشد. اتصال اینترنت را بررسی و صفحه را دوباره باز کنید.</div><script type="module">
import * as THREE from 'https://esm.sh/three@0.169.0';
const names=['پوشاک','موبایل','جواهرات','خانه','کفش','اسباب‌بازی','ورزش','آرایشی','کتاب','ابزار','خودرو','سلامت','مبلمان','گل','حیوانات','ساعت','سفر','خوراکی','موسیقی','هدایا'];
const icons=['👗','📱','💎','🏠','👟','🧸','⚽','💄','📚','🛠️','🚗','🧴','🛋️','🪴','🐾','⌚','🧳','🍫','🎸','🎁'];
const colors=[0xf2a915,0x159bd2,0x243d66,0xe86d40,0x2b6c83,0x7a5fba,0x269d80,0xd5678d,0xb67b4e,0x567a93];
const scene=new THREE.Scene();scene.background=new THREE.Color(0xc7d7e1);scene.fog=new THREE.Fog(0xc7d7e1,80,200);
const camera=new THREE.PerspectiveCamera(77,innerWidth/innerHeight,.1,220);camera.position.set(0,1.68,4);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.55;document.getElementById('view').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0xa3b2bf,3.3));const sun=new THREE.DirectionalLight(0xffffff,2.0);sun.position.set(0,12,12);scene.add(sun);
function mat(c,rough=.65,metal=0){return new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal})}const white=mat(0xf6f7f5),tile=mat(0xe5ebee,.08,.45),dark=mat(0x1a334a),glass=new THREE.MeshPhysicalMaterial({color:0xc5eaff,transparent:true,opacity:.19,metalness:.08,roughness:.07,depthWrite:false,side:THREE.DoubleSide}),gold=mat(0xffd07a,.3,.3),green=mat(0x278447);
function box(w,h,d,x,y,z,m){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}
function sign(text,bg=0x1a3552){let c=document.createElement('canvas');c.width=512;c.height=128;let ctx=c.getContext('2d');ctx.fillStyle='#'+bg.toString(16).padStart(6,'0');ctx.fillRect(0,0,512,128);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 48px Tahoma,Arial';ctx.fillText(text,256,82);let tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;return new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide})}
const length=132;
box(14,.15,length,0,-.11,-length/2+5,tile);for(let x of [-5.95,5.95])box(.055,.012,length,x,.008,-length/2+5,mat(0x526f83,.15,.7));box(2,.025,length,-4.1,-.01,-length/2+5,mat(0xb9d1dc,.17,.3));box(2,.025,length,4.1,-.01,-length/2+5,mat(0xb9d1dc,.17,.3));
for(let z=5;z>-length+10;z-=3){box(14,.009,.028,0,.005,z,mat(0xc7d7dd,.3,.1));box(.022,.01,3,0,.008,z-1.5,mat(0xd7e3e8,.4))}
box(14,.2,length,0,6.7,-length/2+5,white);box(1,.04,length,-5.8,6.53,-length/2+5,gold);box(1,.04,length,5.8,6.53,-length/2+5,gold);
for(let z=3;z>-length+10;z-=4){for(let x of [-4,-2,0,2,4]){let lamp=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.02,12),new THREE.MeshBasicMaterial({color:0xffffff}));lamp.rotation.x=Math.PI/2;lamp.position.set(x,6.57,z);scene.add(lamp)}}
const hit=[];function plant(x,z){box(.48,.6,.48,x,.3,z,mat(0xd9b24e));let leaves=new THREE.Mesh(new THREE.SphereGeometry(.57,7,6),green);leaves.position.set(x,1.02,z);scene.add(leaves);for(let i=0;i<4;i++){let leaf=new THREE.Mesh(new THREE.ConeGeometry(.25,1.05,5),green);leaf.position.set(x+Math.sin(i*1.57)*.3,1.43,z+Math.cos(i*1.57)*.3);leaf.rotation.z=Math.sin(i*1.57)*.3;scene.add(leaf)}}
for(let i=0;i<20;i++){let side=i%2===0?-1:1;let z=-i*6.1-4;let color=colors[i%colors.length];box(3.7,5.5,5,side*8.6,2.8,z-1.2,mat(color));box(.12,4.4,4.6,side*6.68,2.5,z-1.2,mat(0xe6eef2,.22,.45));box(.10,3.7,3.8,side*6.57,2.5,z-1.2,glass);box(.35,5.8,5,side*6.85,2.8,z-1.2,mat(color));box(.035,4.1,4.15,side*6.52,2.6,z-1.2,glass);box(.12,4.4,.09,side*6.57,2.7,z-3.2,white);box(.12,4.4,.09,side*6.57,2.7,z+.9,white);box(.1,.1,4.3,side*6.55,4.85,z-1.2,gold);
let title=new THREE.Mesh(new THREE.PlaneGeometry(3.6,.85),sign(names[i]));title.position.set(side*6.43,5.5,z-1.1);title.rotation.y=side===-1?Math.PI/2:-Math.PI/2;scene.add(title);
let display=new THREE.Mesh(new THREE.BoxGeometry(.13,.09,3.5),mat(0xf4f7fa,.22,.35));display.position.set(side*6.2,1.15,z-1.2);scene.add(display);
for(let j=0;j<3;j++){let goods=new THREE.Mesh(new THREE.BoxGeometry(.45,.65,.55),mat(colors[(i+j+2)%colors.length]));goods.position.set(side*6.08,1.6,z-2.25+j*1.05);scene.add(goods)}
let door=box(.12,3.7,1.65,side*6.48,1.85,z-1.2,glass);door.userData.store=i;hit.push(door);
plant(side*5.3,z+1.4)}
for(let i=0;i<10;i++){let z=-i*12-8;let ad=new THREE.Mesh(new THREE.PlaneGeometry(3.4,.65),sign(['تبلیغات ویژه','پیشنهاد امروز','خرید جهانی'][i%3],0x173653));ad.position.set(0,5.5,z);scene.add(ad)}
let progress=0,target=0,lateral=0,lateralTarget=0,yaw=0,yawTarget=0;const max=111;let dragging=false,lastY=0,lastX=0,startX=0,startY=0,travel=0;const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{dragging=true;lastY=e.clientY;lastX=e.clientX;startX=e.clientX;startY=e.clientY;travel=0;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!dragging)return;let d=lastY-e.clientY,dx=e.clientX-lastX;lastY=e.clientY;lastX=e.clientX;travel+=Math.abs(d)+Math.abs(dx);if(Math.abs(dx)>Math.abs(d)*.65)yawTarget=THREE.MathUtils.clamp(yawTarget-dx*.006,-1.35,1.35);if(Math.abs(d)>Math.abs(dx)*.65)target=THREE.MathUtils.clamp(target+d*.047,0,max)});canvas.addEventListener('pointerup',e=>{dragging=false;if(travel<12&&Math.abs(e.clientY-startY)<12){const mouse=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);const ray=new THREE.Raycaster();ray.setFromCamera(mouse,camera);let hits=ray.intersectObjects(hit);if(hits.length)enter(hits[0].object.userData.store)}});canvas.addEventListener('wheel',e=>{e.preventDefault();target=THREE.MathUtils.clamp(target+e.deltaY*.018,0,max)},{passive:false});document.getElementById('left').onclick=()=>{lateralTarget=Math.max(-3.7,lateralTarget-1.2);yawTarget=-.65};document.getElementById('right').onclick=()=>{lateralTarget=Math.min(3.7,lateralTarget+1.2);yawTarget=.65};document.getElementById('forward').onclick=()=>target=Math.min(max,target+3);document.getElementById('back').onclick=()=>target=Math.max(0,target-3);
const overlay=document.getElementById('overlay');let selected=0,cart=0;window.enter=function(i){selected=i;overlay.dataset.view='store';overlay.style.display='block';document.getElementById('navback').style.display='block';overlay.scrollTop=0;overlay.innerHTML='<div class="top"><h2>'+icons[i]+' '+names[i]+'</h2><button type="button" onclick="window.closeShop()">↩ بازگشت به بازار</button></div><p>محصولات فروشگاه نمونه</p><div class="shelf">'+Array.from({length:8},(_,n)=>'<div class="product" onclick="detail('+n+')"><span class="emoji">'+icons[i]+'</span>محصول '+(n+1)+'<p>$'+(29+15*n)+'.00</p><button>مشاهده محصول</button></div>').join('')+'</div>'};window.detail=function(n){overlay.dataset.view='detail';document.getElementById('navback').style.display='block';overlay.scrollTop=0;overlay.innerHTML='<div class="top"><h2>مشخصات محصول</h2><button type="button" onclick="window.enter(selected)">↩ بازگشت به مغازه</button></div><div class="detail"><div style="font-size:85px;text-align:center">'+icons[selected]+'</div><h2>'+names[selected]+' — محصول '+(n+1)+'</h2><h2>$'+(29+15*n)+'.00</h2><p>فروشنده: فروشگاه آزمایشی</p><p>🚚 ارسال استاندارد یا سریع</p><p>📦 موجودی نمایشی</p><p>↩ شرایط مرجوعی فروشنده</p><button onclick="addCart()">🛒 افزودن به سبد</button><p>پرداخت واقعی فعال نیست.</p></div>'};window.addCart=function(){cart++;document.getElementById('cart').textContent='🛒 '+cart;alert('به سبد آزمایشی اضافه شد')};window.closeShop=function(){overlay.style.display='none';overlay.dataset.view='mall';document.getElementById('navback').style.display='none'};document.getElementById('navback').addEventListener('click',function(){if(overlay.dataset.view==='detail'){window.enter(selected)}else{window.closeShop()}});overlay.addEventListener('click',function(e){const b=e.target.closest('[data-back]');if(!b)return;e.preventDefault();e.stopPropagation();if(b.dataset.back==='mall'){window.closeShop()}else{window.enter(selected)}});
function animate(t){requestAnimationFrame(animate);progress+=(target-progress)*.09;lateral+=(lateralTarget-lateral)*.1;yaw+=(yawTarget-yaw)*.12;camera.position.z=4-progress;camera.position.x=lateral;camera.position.y=1.68+Math.sin(t*.003)*.018;camera.lookAt(lateral+Math.sin(yaw)*12,1.62,camera.position.z-Math.cos(yaw)*12);document.getElementById('position').textContent='پیشروی '+Math.round(progress/max*100)+'٪';renderer.render(scene,camera)}animate(0);document.getElementById('loading').style.display='none';addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script><script>setTimeout(()=>{if(document.getElementById('loading').style.display!=='none'){document.getElementById('loading').style.display='none';document.getElementById('fallback').style.display='block'}},16000)</script></body></html>
