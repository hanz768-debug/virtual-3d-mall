<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PESIVIA | Products</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#18212d;font:16px system-ui,sans-serif}header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:16px;background:#fff;border-bottom:1px solid #dce3eb;flex-wrap:wrap}a{color:#284b7b}main{max-width:1100px;margin:auto;padding:18px}button,.btn,input{font:inherit;border:1px solid #b8c4d2;border-radius:12px;padding:11px;background:#fff;color:#18212d}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.btn{text-decoration:none;display:inline-block}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin:18px 0}.card{background:#fff;border:1px solid #dce3eb;border-radius:16px;padding:12px;min-width:0}.card img{width:100%;height:180px;object-fit:contain;background:#fff;border-radius:12px}.card h3{font-size:16px;overflow-wrap:anywhere}.price{font-weight:700;margin:10px 0}.pager{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:22px 0}.muted{color:#526071}#message{margin:14px 0}@media(max-width:430px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:9px}.card img{height:145px}.card h3{font-size:14px}}</style></head><body><header><a id="back" class="btn" href="pesivia-store-directory.html">← Back to Store</a><strong>PESIVIA MARKET</strong><a class="btn" href="pesivia-cart.html">🛒 My Cart</a></header><main><h1>All Products</h1><p class="muted">Browse published products from this store.</p><label>Find a product <input id="search" type="search" placeholder="Search products" style="display:block;width:100%;max-width:500px;margin-top:8px"></label><p id="message" role="status">Loading products…</p><div id="grid" class="grid"></div><nav class="pager"><button id="prev">← Previous</button><span id="page"></span><button id="next">Next →</button></nav></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>
(async()=>{'use strict';const q=new URLSearchParams(location.search),market=q.get('market'),num=Number(q.get('unit')),back=document.getElementById('back'),grid=document.getElementById('grid'),msg=document.getElementById('message'),prev=document.getElementById('prev'),next=document.getElementById('next'),label=document.getElementById('page'),search=document.getElementById('search');back.href='pesivia-storefront.html?market='+encodeURIComponent(market||'')+'&unit='+encodeURIComponent(num);if(!market||!Number.isInteger(num)||num<1){msg.textContent='Invalid store.';return}if(!window.supabase){msg.textContent='Service unavailable.';return}const api=window.supabase.createClient(window.MALL_SUPABASE_URL,window.MALL_SUPABASE_PUBLISHABLE_KEY);const {data:unit,error:ue}=await api.from('mall_units').select('id').eq('market_id',market).eq('unit_number',num).maybeSingle();if(ue||!unit){msg.textContent='Store not found.';return}let page=0,term='',token=0;const size=20;async function load(){const current=++token;grid.replaceChildren();msg.textContent='Loading products…';let query=api.from('mall_products').select('id,title,price_cents,currency',{count:'exact'}).eq('unit_id',unit.id).eq('status','published');if(term)query=query.ilike('title','%'+term.replace(/[%_,]/g,'')+'%');const {data,error,count}=await query.order('created_at',{ascending:false}).range(page*size,page*size+size-1);if(current!==token)return;if(error){msg.textContent='Could not load products: '+error.message;return}msg.textContent=count+' published product'+(count===1?'':'s');label.textContent='Page '+(page+1)+' of '+Math.max(1,Math.ceil(count/size));prev.disabled=page===0;next.disabled=(page+1)*size>=count;if(!data.length){grid.textContent='No products found.';return}const ids=data.map(p=>p.id);const {data:photos}=await api.from('mall_product_images').select('product_id,storage_path').in('product_id',ids).eq('status','approved');const paths=new Map();for(const photo of photos||[])if(!paths.has(photo.product_id))paths.set(photo.product_id,photo.storage_path);for(const p of data){const card=document.createElement('article');card.className='card';const a=document.createElement('a');a.href='pesivia-product-detail.html?market='+encodeURIComponent(market)+'&unit='+encodeURIComponent(num)+'&product='+encodeURIComponent(p.id);const img=document.createElement('img');img.alt=p.title;img.loading='lazy';a.append(img);const h=document.createElement('h3');h.textContent=p.title;a.append(h);const price=document.createElement('p');price.className='price';price.textContent=(p.price_cents/100).toFixed(2)+' '+(p.currency||'USD');card.append(a,price);grid.append(card);const path=paths.get(p.id);if(path){api.storage.from('mall-product-images').createSignedUrl(path,3600).then(({data:res})=>{if(res?.signedUrl&&current===token)img.src=res.signedUrl})}}}prev.onclick=()=>{if(page>0){page--;load()}};next.onclick=()=>{page++;load()};let wait;search.oninput=()=>{clearTimeout(wait);wait=setTimeout(()=>{term=search.value.trim();page=0;load()},250)};await load()})();
</script></body></html>
