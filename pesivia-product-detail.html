<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PESIVIA | Products</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5fa;color:#18212d;font:16px system-ui,sans-serif}header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:16px;background:#fff;border-bottom:1px solid #dce3eb;flex-wrap:wrap}a{color:#284b7b}main{max-width:1100px;margin:auto;padding:18px}button,.btn,input{font:inherit;border:1px solid #b8c4d2;border-radius:12px;padding:11px;background:#fff;color:#18212d}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.btn{text-decoration:none;display:inline-block}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin:18px 0}.card{background:#fff;border:1px solid #dce3eb;border-radius:16px;padding:12px;min-width:0}.card img{width:100%;height:180px;object-fit:contain;background:#fff;border-radius:12px}.card h3{font-size:16px;overflow-wrap:anywhere}.price{font-weight:700;margin:10px 0}.pager{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:22px 0}.muted{color:#526071}#message{margin:14px 0}@media(max-width:430px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:9px}.card img{height:145px}.card h3{font-size:14px}}</style></head><body><header><a id="back" class="btn" href="pesivia-store-directory.html">← Back to Store</a><strong>PESIVIA MARKET</strong><a class="btn" href="pesivia-cart.html">🛒 My Cart</a></header><main><div id="message" role="status">Loading product…</div><article id="product" class="card" hidden style="max-width:780px;margin:20px auto;padding:22px"><img id="photo" alt="" style="height:auto;max-height:480px;display:none"><h1 id="name"></h1><p id="description"></p><p id="price" class="price"></p><button id="add">Add to Cart</button><p id="result" role="status"></p></article></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>
(async()=>{'use strict';const q=new URLSearchParams(location.search),market=q.get('market'),num=Number(q.get('unit')),id=q.get('product'),msg=document.getElementById('message'),back=document.getElementById('back');back.href='pesivia-all-products.html?market='+encodeURIComponent(market||'')+'&unit='+encodeURIComponent(num);back.textContent='← All Products';if(!market||!Number.isInteger(num)||!id){msg.textContent='Invalid product link.';return}if(!window.supabase){msg.textContent='Service unavailable.';return}const api=window.supabase.createClient(window.MALL_SUPABASE_URL,window.MALL_SUPABASE_PUBLISHABLE_KEY);const {data:unit}=await api.from('mall_units').select('id').eq('market_id',market).eq('unit_number',num).maybeSingle();if(!unit){msg.textContent='Store not found.';return}const {data:p,error}=await api.from('mall_products').select('id,title,description,price_cents,currency').eq('id',id).eq('unit_id',unit.id).eq('status','published').maybeSingle();if(error||!p){msg.textContent='This product is not available.';return}document.title=p.title+' | PESIVIA';document.getElementById('name').textContent=p.title;document.getElementById('description').textContent=p.description||'';document.getElementById('price').textContent=(p.price_cents/100).toFixed(2)+' '+(p.currency||'USD');const {data:photos}=await api.from('mall_product_images').select('storage_path').eq('product_id',p.id).eq('status','approved').limit(1);if(photos?.[0]){const {data:signed}=await api.storage.from('mall-product-images').createSignedUrl(photos[0].storage_path,3600);if(signed?.signedUrl){const img=document.getElementById('photo');img.src=signed.signedUrl;img.alt=p.title;img.style.display='block'}}document.getElementById('product').hidden=false;msg.textContent='';document.getElementById('add').onclick=()=>{try{const cart=JSON.parse(localStorage.getItem('pesivia-market-cart-v1')||'[]');const existing=cart.find(x=>x.id===String(p.id));if(existing)existing.qty=Math.min(99,existing.qty+1);else cart.push({id:String(p.id),title:p.title,price_cents:p.price_cents,currency:p.currency||'USD',qty:1,market,unit:num});localStorage.setItem('pesivia-market-cart-v1',JSON.stringify(cart));document.getElementById('result').textContent='Added to My Cart.'}catch(e){document.getElementById('result').textContent='Could not update cart.'}}})();
</script></body></html>
