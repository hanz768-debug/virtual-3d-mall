<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مشاهده مغازه | World Virtual Mall</title><style>body{margin:0;background:#f5f6f9;color:#192b40;font:16px Tahoma,Arial}header{background:#122940;color:#fff;padding:20px}header a{color:#e6bd75}main{max-width:750px;margin:30px auto;padding:16px}section{background:white;padding:28px;border-radius:18px;margin-bottom:18px}p{line-height:2}a.btn{display:inline-block;background:#e6bd75;padding:12px 16px;border-radius:9px;color:#182a3d;text-decoration:none}</style></head><body><header>🏬 World Virtual Mall　<a href="stores.html">فهرست مغازه‌ها</a></header><main><section><h1 id="title">مغازه</h1><p id="status">در حال بررسی...</p><p>در این نسخه آزمایشی فقط اطلاعات تأییدشده و عمومی نمایش داده می‌شود. فیلم‌های در انتظار بررسی و محصولات پیش‌نویس عمومی نیستند.</p><a id="back" class="btn" href="stores.html">بازگشت به بازار</a></section><section><h2>محصولات منتشرشده</h2><div id="products">در حال بررسی...</div></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>
const p=new URLSearchParams(location.search),market=p.get('market'),num=Number(p.get('unit')),status=document.getElementById('status'),products=document.getElementById('products');document.getElementById('back').href='stores.html?market='+encodeURIComponent(market||'jewelry');if(!market||!Number.isSafeInteger(num)||num<1){status.textContent='نشانی مغازه نامعتبر است';products.textContent='';}else{document.getElementById('title').textContent='مغازه '+String(num).padStart(3,'0');(async()=>{if(!window.supabase||!window.MALL_SUPABASE_PUBLISHABLE_KEY){status.textContent='اتصال موجود نیست';return}const api=window.supabase.createClient(window.MALL_SUPABASE_URL,window.MALL_SUPABASE_PUBLISHABLE_KEY);const {data:u,error}=await api.from('mall_units').select('id,status').eq('market_id',market).eq('unit_number',num).maybeSingle();if(error||!u){status.textContent='مغازه یافت نشد';products.textContent='';return}status.textContent=u.status==='occupied'?'مغازه واگذار شده است.':u.status==='reserved'?'مغازه رزرو شده است.':'مغازه آماده واگذاری است.';const {data:items,error:e}=await api.from('mall_products').select('title,description,price_cents,currency').eq('unit_id',u.id).eq('status','published').limit(50);products.replaceChildren();if(e){products.textContent='خطا در دریافت محصولات';return}if(!items?.length){products.textContent='هنوز محصول منتشرشده‌ای وجود ندارد.';return}for(const item of items){const div=document.createElement('article');const h=document.createElement('h3');h.textContent=item.title;const d=document.createElement('p');d.textContent=item.description||'';const price=document.createElement('strong');price.textContent=(item.price_cents/100).toFixed(2)+' '+item.currency;div.append(h,d,price);products.append(div)}})()}
</script><script src="language.js"></script></body></html>
