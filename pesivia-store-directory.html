<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PESIVIA · Store Directory</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1326;color:#f5f0ff;font:15px system-ui,-apple-system,sans-serif}header{background:#111b36;border-bottom:1px solid #7c55b4;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}a{color:#e5c6ff}header a{text-decoration:none}.headerLeft{display:flex;align-items:center;gap:10px;flex-wrap:wrap}#backButton{background:#243457;color:#fff;border:1px solid #a98ada;border-radius:10px;padding:10px 13px;font:inherit;cursor:pointer;white-space:nowrap}select,input{background:#1a2948;color:white;border:1px solid #7767a2;border-radius:11px;padding:12px;font:inherit;min-width:0}main{max-width:1060px;margin:auto;padding:20px 14px}h1{font-size:24px;margin:12px 0}p{line-height:1.6}.sub{color:#b9b7d3}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}.toolbar input{grid-column:1/-1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.card{background:#172443;border:1px solid #594c7d;border-radius:16px;padding:17px}.num{font-size:24px;font-weight:700}.status{color:#d5c5ed}.btn{display:inline-block;padding:10px 12px;background:#6e38b4;border-radius:9px;color:white;text-decoration:none}.notice{border:1px solid #65558d;border-radius:11px;padding:14px;background:#182342}.topActions{display:flex;align-items:center;gap:10px}footer{padding:20px;text-align:center;color:#a9a3be}@media(min-width:650px){.toolbar{grid-template-columns:1fr 2fr}.toolbar input{grid-column:auto}}</style></head><body><header><div class="headerLeft"><button id="backButton" type="button">← Back</button><a href="pesivia-market-home-v4.html"><strong>🌐 PESIVIA MARKET</strong></a></div><div class="topActions"><label for="language" data-i="language">Language</label><select id="language"><option value="en">English</option><option value="fa">فارسی</option><option value="es">Español</option></select></div></header><main><h1 data-i="title">Store Directory</h1><p class="sub" data-i="intro">These are actual store units registered in the PESIVIA marketplace database. A listed unit does not necessarily have products or online checkout enabled.</p><div class="toolbar"><select id="market" aria-label="Market"><option value="jewelry" data-i="jewelry">💎 Jewelry</option><option value="shoes" data-i="shoes">👟 Shoes</option><option value="beauty" data-i="beauty">💄 Beauty</option><option value="electronics" data-i="electronics">📱 Electronics</option><option value="sports" data-i="sports">🏀 Sports</option></select><input id="search" placeholder="Search store number, e.g. 003" aria-label="Search store"></div><p id="status" role="status"></p><div class="grid" id="grid"></div></main><footer data-i="footer">Preview · No checkout or payment on this page</footer><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>
const words={en:{language:'Language',title:'Store Directory',intro:'These are actual store units registered in the PESIVIA marketplace database. A listed unit does not necessarily have products or online checkout enabled.',jewelry:'💎 Jewelry',shoes:'👟 Shoes',beauty:'💄 Beauty',electronics:'📱 Electronics',sports:'🏀 Sports',back:'← Back',footer:'Preview · No checkout or payment on this page',search:'Search store number, e.g. 003',loading:'Loading registered stores…',offline:'Marketplace connection is unavailable.',error:'Unable to load stores: ',unit:'Store ',occupied:'Assigned',reserved:'Reserved',available:'Available',view:'View Store',count:' stores shown',empty:'No matching stores.'},fa:{language:'زبان',title:'فهرست فروشگاه‌ها',intro:'این‌ها واحدهای ثبت‌شده واقعی بازار PESIVIA هستند. وجود واحد لزوماً به معنی فعال بودن محصولات یا پرداخت آنلاین نیست.',jewelry:'💎 جواهرات',shoes:'👟 کفش',beauty:'💄 زیبایی',electronics:'📱 الکترونیک',sports:'🏀 ورزش',back:'← بازگشت',footer:'پیش‌نمایش · پرداخت در این صفحه فعال نیست',search:'جستجوی شماره مغازه، مانند 003',loading:'در حال دریافت فروشگاه‌ها…',offline:'اتصال به پایگاه داده بازار در دسترس نیست.',error:'خطا در دریافت فروشگاه‌ها: ',unit:'مغازه ',occupied:'واگذارشده',reserved:'رزرو شده',available:'آماده واگذاری',view:'مشاهده مغازه',count:' مغازه نمایش داده می‌شود',empty:'فروشگاهی یافت نشد.'},es:{language:'Idioma',title:'Directorio de tiendas',intro:'Estas son unidades reales registradas en PESIVIA. Una unidad no implica que tenga productos o pagos activos.',jewelry:'💎 Joyería',shoes:'👟 Calzado',beauty:'💄 Belleza',electronics:'📱 Electrónica',sports:'🏀 Deportes',back:'← Volver',footer:'Vista previa · Sin pagos en esta página',search:'Buscar número de tienda, p. ej. 003',loading:'Cargando tiendas…',offline:'La conexión al mercado no está disponible.',error:'Error al cargar: ',unit:'Tienda ',occupied:'Asignada',reserved:'Reservada',available:'Disponible',view:'Ver tienda',count:' tiendas',empty:'No se encontraron tiendas.'}};
const params=new URLSearchParams(location.search),select=document.getElementById('market'),search=document.getElementById('search'),grid=document.getElementById('grid'),status=document.getElementById('status'),langControl=document.getElementById('language');if(['jewelry','shoes','beauty','electronics','sports'].includes(params.get('market')))select.value=params.get('market');search.value=params.get('q')||'';
let lang='en',units=[];try{lang=words[params.get('lang')]?params.get('lang'):(words[localStorage.getItem('pesivia-market-language')]?localStorage.getItem('pesivia-market-language'):'en')}catch(e){}const t=k=>words[lang][k]||words.en[k];
function setLanguage(value){lang=words[value]?value:'en';langControl.value=lang;document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));search.placeholder=t('search');document.getElementById('backButton').textContent=t('back');search.setAttribute('aria-label',t('search'));try{localStorage.setItem('pesivia-market-language',lang)}catch(e){}render()}langControl.onchange=e=>setLanguage(e.target.value);
function render(){grid.replaceChildren();const q=search.value.trim().toLowerCase();const shown=units.filter(u=>String(u.unit_number).padStart(3,'0').includes(q));for(const u of shown){const card=document.createElement('article');card.className='card';const num=document.createElement('div');num.className='num';num.textContent=t('unit')+String(u.unit_number).padStart(3,'0');const st=document.createElement('p');st.className='status';st.textContent=t(u.status==='occupied'?'occupied':u.status==='reserved'?'reserved':'available');const link=document.createElement('a');link.className='btn';link.href='pesivia-storefront.html?market='+encodeURIComponent(u.market_id)+'&unit='+encodeURIComponent(u.unit_number)+'&lang='+encodeURIComponent(lang);link.textContent=t('view');card.append(num,st,link);grid.append(card)}status.textContent=shown.length+t('count');if(!shown.length){const el=document.createElement('p');el.className='notice';el.textContent=t('empty');grid.append(el)}}
const api=window.supabase&&window.MALL_SUPABASE_PUBLISHABLE_KEY&&!window.MALL_SUPABASE_PUBLISHABLE_KEY.startsWith('REPLACE_')?window.supabase.createClient(window.MALL_SUPABASE_URL,window.MALL_SUPABASE_PUBLISHABLE_KEY):null;
async function load(){status.textContent=t('loading');grid.replaceChildren();if(!api){status.textContent=t('offline');return}const {data,error}=await api.from('mall_units').select('market_id,unit_number,status').eq('market_id',select.value).order('unit_number').limit(500);if(error){status.textContent=t('error')+error.message;return}units=data||[];render()}
select.onchange=()=>{const p=new URLSearchParams(location.search);p.set('market',select.value);history.replaceState(null,'','?'+p);load()};search.oninput=()=>{const p=new URLSearchParams(location.search);if(search.value)p.set('q',search.value);else p.delete('q');history.replaceState(null,'','?'+p);render()};document.getElementById('backButton').onclick=()=>{try{if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){history.back();return}}catch(e){}location.href='pesivia-services-hub.html?lang='+encodeURIComponent(lang)};setLanguage(lang);load();
</script></body></html>
