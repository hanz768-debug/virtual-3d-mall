<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PESIVIA · Storefront</title><style>*{box-sizing:border-box}body{margin:0;background:#0a1225;color:#f7f3ff;font:15px system-ui,-apple-system,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#101a36;padding:16px;border-bottom:1px solid #7950b8}a{color:#e5c5ff}header a{text-decoration:none}.control{display:flex;gap:8px;align-items:center}select,button{border:1px solid #826ba8;border-radius:10px;background:#203052;color:white;padding:10px;font:inherit;cursor:pointer}main{max-width:1000px;margin:auto;padding:20px 14px}h1{font-size:26px;margin:8px 0}.sub{color:#bcb7d0;line-height:1.7}.panel{background:#172441;border:1px solid #574877;border-radius:15px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}.product{background:#1a2b4b;border:1px solid #605484;border-radius:13px;padding:17px}.product h3{margin:0 0 10px}.product p{line-height:1.55;color:#d5d0e3}.price{font-weight:700;color:#f0cf91;font-size:19px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:13px}.favorite[aria-pressed=true]{background:#7139a7}.notice{padding:13px;border:1px solid #6e598e;border-radius:11px;color:#d4cce6}footer{text-align:center;color:#9c9db5;padding:20px}.back{display:inline-block;margin:8px 0 12px}</style><link rel="stylesheet" href="pesivia-shared-background.css?v=4766f2b5"></head><body><header><a href="pesivia-market-multilingual.html"><strong>🌐 PESIVIA MARKET</strong></a><div class="control"><label for="language" data-i="language">Language</label><select id="language"><option value="en">English</option><option value="fa">فارسی</option><option value="es">Español</option></select></div></header><main><a id="back" class="back" href="pesivia-store-directory.html" data-i="back">← Store Directory</a><div class="panel"><h1 id="title">Store</h1><p id="status" role="status" class="sub"></p><p class="sub" data-i="intro">Only published products from the real marketplace database are displayed. Payments and order placement are not enabled in this preview.</p></div><h2 data-i="products">Published Products</h2><a href="pesivia-cart.html" id="cartLink" class="back">🛒 My Cart</a><div id="grid" class="grid"></div></main><footer data-i="footer">PESIVIA · Marketplace preview · No live checkout</footer><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>
const words={en:{language:'Language',back:'← Store Directory',intro:'Only published products from the real marketplace database are displayed. Payments and order placement are not enabled in this preview.',products:'Published Products',footer:'PESIVIA · Marketplace preview · No live checkout',store:'Store ',loading:'Loading store…',invalid:'Invalid store address.',missing:'Store not found.',offline:'Marketplace connection is unavailable.',occupied:'Store assigned',reserved:'Store reserved',available:'Store available for lease',error:'Unable to load published products.',empty:'No published products in this store yet.',favorite:'♡ Save',saved:'♥ Saved',copy:'Copy Product Info',copied:'Copied',add:'Add to Cart',added:'✓ Added',copyFail:'Copy failed',currency:'',unit:'Store'},fa:{language:'زبان',back:'← فهرست فروشگاه‌ها',intro:'فقط محصولات منتشرشده از پایگاه داده واقعی نمایش داده می‌شوند. پرداخت و ثبت سفارش هنوز فعال نیست.',products:'محصولات منتشرشده',footer:'PESIVIA · پیش‌نمایش بازار · بدون پرداخت',store:'مغازه ',loading:'در حال دریافت مغازه…',invalid:'آدرس مغازه نامعتبر است.',missing:'مغازه یافت نشد.',offline:'اتصال بازار در دسترس نیست.',occupied:'مغازه واگذارشده',reserved:'مغازه رزرو شده',available:'مغازه آماده واگذاری',error:'دریافت محصولات ممکن نشد.',empty:'هنوز محصول منتشرشده‌ای وجود ندارد.',favorite:'♡ ذخیره',saved:'♥ ذخیره‌شده',copy:'کپی اطلاعات محصول',copied:'کپی شد',add:'افزودن به سبد',added:'✓ افزوده شد',copyFail:'کپی انجام نشد',currency:'',unit:'مغازه'},es:{language:'Idioma',back:'← Directorio',intro:'Solo se muestran productos publicados en la base de datos real. Los pagos y pedidos no están disponibles.',products:'Productos publicados',footer:'PESIVIA · Vista previa · Sin pagos',store:'Tienda ',loading:'Cargando tienda…',invalid:'Dirección de tienda inválida.',missing:'Tienda no encontrada.',offline:'Conexión no disponible.',occupied:'Tienda asignada',reserved:'Tienda reservada',available:'Tienda disponible',error:'No se pueden cargar los productos.',empty:'Todavía no hay productos publicados.',favorite:'♡ Guardar',saved:'♥ Guardado',copy:'Copiar información',copied:'Copiado',add:'Añadir al carrito',added:'✓ Añadido',copyFail:'No se pudo copiar',currency:'',unit:'Tienda'}};
const params=new URLSearchParams(location.search),market=params.get('market'),num=Number(params.get('unit')),langControl=document.getElementById('language'),grid=document.getElementById('grid'),status=document.getElementById('status');let lang='en',unitState=null,products=null,problem=null;try{lang=words[params.get('lang')]?params.get('lang'):(words[localStorage.getItem('pesivia-market-language')]?localStorage.getItem('pesivia-market-language'):'en')}catch(e){}const t=k=>words[lang][k]||words.en[k];function favorites(){try{return JSON.parse(localStorage.getItem('pesivia-market-favorites')||'[]')}catch(e){return []}}function saveFavorites(a){try{localStorage.setItem('pesivia-market-favorites',JSON.stringify(a))}catch(e){}}
function setLanguage(value){lang=words[value]?value:'en';langControl.value=lang;document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));document.getElementById('back').href='pesivia-store-directory.html?market='+encodeURIComponent(market||'jewelry')+'&lang='+encodeURIComponent(lang);document.getElementById('cartLink').href='pesivia-cart.html?lang='+encodeURIComponent(lang);try{localStorage.setItem('pesivia-market-language',lang)}catch(e){}render()}langControl.onchange=e=>setLanguage(e.target.value);
function render(){document.getElementById('title').textContent=t('store')+String(num||'').padStart(3,'0');status.textContent=problem?t(problem):unitState?t(unitState):t('loading');grid.replaceChildren();if(problem||products===null)return;if(!products.length){const p=document.createElement('p');p.className='notice';p.textContent=t('empty');grid.append(p);return}products.forEach((item,index)=>{const card=document.createElement('article');card.className='product';const h=document.createElement('h3');h.textContent=item.title;const desc=document.createElement('p');desc.textContent=item.description||'';const price=document.createElement('div');price.className='price';price.textContent=(item.price_cents/100).toLocaleString(lang,{minimumFractionDigits:2,maximumFractionDigits:2})+' '+(item.currency||'USD');const actions=document.createElement('div');actions.className='actions';const key=market+'/'+num+'/'+item.title+'/'+item.price_cents;const favorite=document.createElement('button');favorite.className='favorite';const update=()=>{const saved=favorites().includes(key);favorite.textContent=t(saved?'saved':'favorite');favorite.setAttribute('aria-pressed',String(saved))};favorite.onclick=()=>{const f=favorites();saveFavorites(f.includes(key)?f.filter(x=>x!==key):[...f,key]);update()};update();const copy=document.createElement('button');copy.textContent=t('copy');copy.onclick=async()=>{const value=item.title+'\n'+(item.description||'')+'\n'+price.textContent+'\n'+location.href;try{await navigator.clipboard.writeText(value);copy.textContent=t('copied')}catch(e){copy.textContent=t('copyFail')}};const add=document.createElement('button');add.textContent=t('add');add.onclick=()=>{try{const cart=JSON.parse(localStorage.getItem('pesivia-market-cart-v1')||'[]');const id=String(item.id);const existing=cart.find(x=>x.id===id);if(existing)existing.qty=Math.min(99,existing.qty+1);else cart.push({id,title:item.title,price_cents:item.price_cents,currency:item.currency||'USD',qty:1,market,unit:num});localStorage.setItem('pesivia-market-cart-v1',JSON.stringify(cart));add.textContent=t('added')}catch(e){add.textContent=t('add')}};actions.append(add,favorite,copy);card.append(h,desc,price,actions);grid.append(card)})}
setLanguage(lang);
(async()=>{if(!market||!Number.isSafeInteger(num)||num<1){problem='invalid';render();return}if(!window.supabase||!window.MALL_SUPABASE_PUBLISHABLE_KEY){problem='offline';render();return}try{const api=window.supabase.createClient(window.MALL_SUPABASE_URL,window.MALL_SUPABASE_PUBLISHABLE_KEY);const {data:u,error:e}=await api.from('mall_units').select('id,status').eq('market_id',market).eq('unit_number',num).maybeSingle();if(e||!u){problem='missing';render();return}unitState=u.status==='occupied'?'occupied':u.status==='reserved'?'reserved':'available';render();const {data:items,error:err}=await api.from('mall_products').select('id,title,description,price_cents,currency').eq('unit_id',u.id).eq('status','published').limit(50);if(err){problem='error';render();return}products=items||[];render()}catch(e){problem='offline';render()}})();
</script></body></html>
