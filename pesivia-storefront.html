</style><style id="pesivia-public-product-image-layout">.product img{display:block;max-width:100%;height:210px;object-fit:contain;background:#fff;border-radius:12px}.product h3{color:#17212e!important;text-shadow:none!important}</style><style id="pesivia-featured-product-heading">.featured-product-name{font-size:clamp(20px,4.5vw,26px)!important;font-weight:750!important;line-height:1.35!important;color:#18212d!important;-webkit-text-fill-color:#18212d!important;text-shadow:none!important;margin:16px 0 12px!important}.featured-product-name[hidden]{display:none!important}#cartLink{display:inline-flex!important;margin-top:20px!important;margin-bottom:12px!important}</style></head><body><header><a class="pesivia-home-link" href="pesivia-services-hub.html" aria-label="Home">⌂ Home</a><a href="pesivia-services-hub.html"><strong>🌐 PESIVIA MARKET</strong></a><div class="control"><label for="language" data-i="language">Language</label><select id="language"><option value="en">English</option><option value="fa">فارسی</option><option value="es">Español</option></select></div></header><main><a id="back" class="back" href="pesivia-store-directory.html" data-i="back">← Store Directory</a><div class="panel"><h1 id="title">Store</h1><p id="status" role="status" class="sub"></p><p class="sub" data-i="intro">Only published products from the real marketplace database are displayed. Payments and order placement are not enabled in this preview.</p></div><div id="pesivia-public-media" aria-live="polite"></div><h2 data-i="products">Published Products</h2><h3 id="featured-product-name" class="featured-product-name" hidden></h3><div id="grid" class="grid"></div><a href="pesivia-cart.html" id="cartLink" class="back">🛒 My Cart</a></main><footer data-i="footer">PESIVIA · Marketplace preview · No live checkout</footer><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>
const words={en:{language:'Language',back:'← Store Directory',intro:'Only published products from the real marketplace database are displayed. Payments and order placement are not enabled in this preview.',products:'Published Products',footer:'PESIVIA · Marketplace preview · No live checkout',store:'Store ',loading:'Loading store…',invalid:'Invalid store address.',missing:'Store not found.',offline:'Marketplace connection is unavailable.',occupied:'Store assigned',reserved:'Store reserved',available:'Store available for lease',error:'Unable to load published products.',empty:'No published products in this store yet.',favorite:'♡ Save',saved:'♥ Saved',copy:'Copy Product Info',copied:'Copied',add:'Add to Cart',added:'✓ Added',copyFail:'Copy failed',currency:'',unit:'Store'},fa:{language:'زبان',back:'← فهرست فروشگاه‌ها',intro:'فقط محصولات منتشرشده از پایگاه داده واقعی نمایش داده می‌شوند. پرداخت و ثبت سفارش هنوز فعال نیست.',products:'محصولات منتشرشده',footer:'PESIVIA · پیش‌نمایش بازار · بدون پرداخت',store:'مغازه ',loading:'در حال دریافت مغازه…',invalid:'آدرس مغازه نامعتبر است.',missing:'مغازه یافت نشد.',offline:'اتصال بازار در دسترس نیست.',occupied:'مغازه واگذارشده',reserved:'مغازه رزرو شده',available:'مغازه آماده واگذاری',error:'دریافت محصولات ممکن نشد.',empty:'هنوز محصول منتشرشده‌ای وجود ندارد.',favorite:'♡ ذخیره',saved:'♥ ذخیره‌شده',copy:'کپی اطلاعات محصول',copied:'کپی شد',add:'افزودن به سبد',added:'✓ افزوده شد',copyFail:'کپی انجام نشد',currency:'',unit:'مغازه'},es:{language:'Idioma',back:'← Directorio',intro:'Solo se muestran productos publicados en la base de datos real. Los pagos y pedidos no están disponibles.',products:'Productos publicados',footer:'PESIVIA · Vista previa · Sin pagos',store:'Tienda ',loading:'Cargando tienda…',invalid:'Dirección de tienda inválida.',missing:'Tienda no encontrada.',offline:'Conexión no disponible.',occupied:'Tienda asignada',reserved:'Tienda reservada',available:'Tienda disponible',error:'No se pueden cargar los productos.',empty:'Todavía no hay productos publicados.',favorite:'♡ Guardar',saved:'♥ Guardado',copy:'Copiar información',copied:'Copiado',add:'Añadir al carrito',added:'✓ Añadido',copyFail:'No se pudo copiar',currency:'',unit:'Tienda'}};
const params=new URLSearchParams(location.search),market=params.get('market'),num=Number(params.get('unit')),langControl=document.getElementById('language'),grid=document.getElementById('grid'),status=document.getElementById('status');let lang='en',unitState=null,products=null,problem=null;try{lang=words[params.get('lang')]?params.get('lang'):(words[localStorage.getItem('pesivia-market-language')]?localStorage.getItem('pesivia-market-language'):'en')}catch(e){}const t=k=>words[lang][k]||words.en[k];function favorites(){try{return JSON.parse(localStorage.getItem('pesivia-market-favorites')||'[]')}catch(e){return []}}function saveFavorites(a){try{localStorage.setItem('pesivia-market-favorites',JSON.stringify(a))}catch(e){}}
function setLanguage(value){lang=words[value]?value:'en';langControl.value=lang;document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));document.getElementById('back').href='pesivia-store-directory.html?market='+encodeURIComponent(market||'jewelry')+'&lang='+encodeURIComponent(lang);document.getElementById('cartLink').href='pesivia-cart.html?lang='+encodeURIComponent(lang);try{localStorage.setItem('pesivia-market-language',lang)}catch(e){}render()}langControl.onchange=e=>setLanguage(e.target.value);
const productPhotoUrls=new Map();function render(){document.getElementById('title').textContent=t('store')+String(num||'').padStart(3,'0');status.textContent=problem?t(problem):unitState?t(unitState):t('loading');grid.replaceChildren();const featured=document.getElementById('featured-product-name');featured.hidden=true;featured.textContent='';if(problem||products===null)return;if(products.length===1){featured.textContent=products[0].title;featured.hidden=false;}if(!products.length){const p=document.createElement('p');p.className='notice';p.textContent=t('empty');grid.append(p);return}products.forEach((item,index)=>{const card=document.createElement('article');card.className='product';const h=document.createElement('h3');h.textContent=item.title;const desc=document.createElement('p');desc.textContent=item.description||'';const price=document.createElement('div');price.className='price';price.textContent=(item.price_cents/100).toLocaleString(lang,{minimumFractionDigits:2,maximumFractionDigits:2})+' '+(item.currency||'USD');const actions=document.createElement('div');actions.className='actions';const key=market+'/'+num+'/'+item.title+'/'+item.price_cents;const favorite=document.createElement('button');favorite.className='favorite';const update=()=>{const saved=favorites().includes(key);favorite.textContent=t(saved?'saved':'favorite');favorite.setAttribute('aria-pressed',String(saved))};favorite.onclick=()=>{const f=favorites();saveFavorites(f.includes(key)?f.filter(x=>x!==key):[...f,key]);update()};update();const copy=document.createElement('button');copy.textContent=t('copy');copy.onclick=async()=>{const value=item.title+'\n'+(item.description||'')+'\n'+price.textContent+'\n'+location.href;try{await navigator.clipboard.writeText(value);copy.textContent=t('copied')}catch(e){copy.textContent=t('copyFail')}};const add=document.createElement('button');add.textContent=t('add');add.onclick=()=>{try{const cart=JSON.parse(localStorage.getItem('pesivia-market-cart-v1')||'[]');const id=String(item.id);const existing=cart.find(x=>x.id===id);if(existing)existing.qty=Math.min(99,existing.qty+1);else cart.push({id,title:item.title,price_cents:item.price_cents,currency:item.currency||'USD',qty:1,market,unit:num});localStorage.setItem('pesivia-market-cart-v1',JSON.stringify(cart));add.textContent=t('added')}catch(e){add.textContent=t('add')}};actions.append(add,favorite,copy);const photo=productPhotoUrls.get(item.id);if(photo){const im=document.createElement('img');im.src=photo;im.alt=item.title;im.loading='lazy';im.style.cssText='width:100%;height:210px;object-fit:contain;border-radius:12px;background:#fff;margin-bottom:12px';card.append(im)}card.append(h,desc,price,actions);grid.append(card)})}
setLanguage(lang);
(async()=>{if(!market||!Number.isSafeInteger(num)||num<1){problem='invalid';render();return}if(!window.supabase||!window.MALL_SUPABASE_PUBLISHABLE_KEY){problem='offline';render();return}try{const api=window.supabase.createClient(window.MALL_SUPABASE_URL,window.MALL_SUPABASE_PUBLISHABLE_KEY);const {data:u,error:e}=await api.from('mall_units').select('id,status').eq('market_id',market).eq('unit_number',num).maybeSingle();if(e||!u){problem='missing';render();return}window.PesiviaPublicMedia?.store(u.id,document.getElementById('pesivia-public-media')).catch(()=>{});unitState=u.status==='occupied'?'occupied':u.status==='reserved'?'reserved':'available';render();const {data:items,error:err}=await api.from('mall_products').select('id,title,description,price_cents,currency').eq('unit_id',u.id).eq('status','published').limit(50);if(err){problem='error';render();return}products=items||[];if(products.length){const ids=products.map(p=>p.id);const {data:photos}=await api.from('mall_product_images').select('product_id,storage_path').in('product_id',ids).eq('status','approved');for(const photo of photos||[]){if(productPhotoUrls.has(photo.product_id))continue;const signed=await api.storage.from('mall-product-images').createSignedUrl(photo.storage_path,3600);if(signed.data?.signedUrl)productPhotoUrls.set(photo.product_id,signed.data.signedUrl)}}render()}catch(e){problem='offline';render()}})();
</script><script src="pesivia-account-sync.js?v=eb79ea42"></script><script src="pesivia-public-store-media.js?v=8337cc18"></script></body></html>
